services:
  bot:
    build:
      context: .
    container_name: fakturabot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /bot/data/storage/fakturabot.db
      STORAGE_DIR: /bot/data/storage
    volumes:
      - ./data/storage:/bot/data/storage
      - ./logs:/bot/logs
      - /bot/secrets:/bot/secrets:ro
    working_dir: /app
    command: python -m bot.main

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4@sha256:4c72c1af2984a66a255efd20fc4ec73fe0f7267384b55315ad953b354b3361b4
    container_name: fakturabot-cloudflared
    restart: unless-stopped
    depends_on:
      - bot
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflared-token
    volumes:
      - /bot/secrets/cloudflared-token:/run/secrets/cloudflared-token:ro
